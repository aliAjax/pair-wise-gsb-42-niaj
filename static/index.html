<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>金融犯罪调查</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1200px;margin:28px auto;padding:0 20px;color:#24313c}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d3dce3;padding:7px}th{background:#eef4f7}.card{background:#f7f2ff;border-left:5px solid #7256b7;padding:12px 16px}code{background:#edf0f2;padding:2px 5px}</style>
<h1>金融犯罪调查与制裁筛查</h1><div class="card">案件严格按角色和调查员分配过滤。写入接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>案件</h2><table id="cases"><thead><tr><th>案件号</th><th>状态</th><th>风险</th><th>调查员</th><th>报告</th></tr></thead><tbody></tbody></table>
<h2>交易</h2><table id="txns"><thead><tr><th>编号</th><th>金额</th><th>币种</th><th>状态</th><th>原因</th></tr></thead><tbody></tbody></table>
<h2>审计时间线</h2><ol id="timeline"></ol>
<script>async function load(){const d=await fetch('/api/state').then(r=>r.json());document.querySelector('#cases tbody').innerHTML=d.cases.map(r=>`<tr><td>${r.case_no}</td><td>${r.status}</td><td>${r.risk_score}</td><td>${r.assignee||''}</td><td>${r.report_ref||''}</td></tr>`).join('');document.querySelector('#txns tbody').innerHTML=d.transactions.map(r=>`<tr><td>${r.txn_ref}</td><td>${r.amount}</td><td>${r.currency}</td><td>${r.status}</td><td>${r.reason}</td></tr>`).join('');document.querySelector('#timeline').innerHTML=d.timeline.slice(0,20).map(x=>`<li>${x.created_at} ${x.action} ${x.details}</li>`).join('')}load()</script></html>
